appId: com.xhs.live.recorder
productName: XHS Live Recorder
directories:
  output: ../../release/desktop
files:
  - out/**
  - resources/**
  - package.json
  - '!out/**/*.map'
  - '!out/**/*.log'
  - '!node_modules/ffmpeg-static/ffmpeg.exe'
  - '!node_modules/@xhs-live-recorder/core/**'
asarUnpack:
  - '**/*.node'
extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg.exe
  - from: node_modules/ffmpeg-static/LICENSE
    to: FFmpeg-LICENSE.txt
win:
  executableName: xhs-live-recorder
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  artifactName: XHS-Live-Recorder-${version}-Windows-x64.${ext}
  shortcutName: XHS Live Recorder
  uninstallDisplayName: XHS Live Recorder
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
npmRebuild: false
electronDist: node_modules/electron/dist
